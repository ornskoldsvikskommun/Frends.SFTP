name: Frends.SFTP.WriteFile Test

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'Frends.SFTP.WriteFile/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    uses: ./.github/workflows/fork_build_test.yml
    with:
      workdir: Frends.SFTP.WriteFile
      prebuild_command: docker-compose -f ./Frends.SFTP.WriteFile.Tests/docker-compose.yml up -d
